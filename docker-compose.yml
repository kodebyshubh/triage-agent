# Local stack: backend + frontend + Redis.
#
# The MCP server is not a separate service on purpose: the backend spawns it as
# a stdio subprocess (python -m mcp_server.server) inside its own container,
# from the same image, and holds that session for the app's lifetime.
#
#   docker compose up --build
#   UI:      http://localhost:8080
#   API:     http://localhost:8000  (docs at /docs, metrics at /metrics)
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_API_KEY: ${VITE_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
