# Render Blueprint: free web service (backend, Docker), free static site
# (frontend) and a free Key Value instance (Redis-compatible) for sessions.
# Secrets use sync: false, so Render asks for them when the Blueprint is created;
# nothing secret lives in this file. Step-by-step guide: docs/DEPLOY_RENDER.md
services:
  - type: web
    name: triageforge-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to India; must match the Key Value below
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TRIAGEFORGE_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: triageforge
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      # A visitor should get a fast 503 when every Groq key is rate-limited,
      # not wait the 300 s default.
      - key: GROQ_MAX_RATE_LIMIT_WAIT_S
        value: "60"
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: triageforge-sessions
          property: connectionString

  - type: web
    name: triageforge-ui
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: triageforge-sessions
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only
